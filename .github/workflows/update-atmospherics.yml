name: Update atmospherics

on:
  schedule:
    # Quarterly — 06:00 UTC on the 1st of Jan, Apr, Jul, Oct
    - cron: "0 6 1 1,4,7,10 *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write        # to dispatch checks.yml on the refresh branch (see below)

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # Pure Node built-ins (fetch/fs/path) — no dependencies to install.
      - name: Refresh atmospheric-item messages from Elanthipedia
        run: node scripts/scrape-atmospherics.js

      # Only opens a PR when the generated file actually changed.
      - name: Open PR on changes
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Refresh atmospheric-item messages from Elanthipedia"
          title: "Refresh atmospheric-item messages"
          body: |
            Automated quarterly refresh of
            `src/renderer/src/lib/atmospherics.generated.ts` from
            https://elanthipedia.play.net/Category:Atmospheric_items via
            `scripts/scrape-atmospherics.js`.

            Auto-merges once `checks` passes — new/changed messages feed the Atmo panel.
          branch: chore/atmospherics-refresh
          delete-branch: true
          add-paths: src/renderer/src/lib/atmospherics.generated.ts

      # A PR opened with GITHUB_TOKEN doesn't trigger pull_request workflows, so the
      # required `checks` status would never arrive and auto-merge would wait forever.
      # workflow_dispatch is exempt from that rule: run checks.yml on the branch, which
      # reports `checks` on the PR's head commit, and let auto-merge take it from there.
      - name: Run checks and auto-merge
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run checks.yml --ref chore/atmospherics-refresh
          gh pr merge ${{ steps.pr.outputs.pull-request-number }} --squash --auto \
            --subject "Refresh atmospheric-item messages (#${{ steps.pr.outputs.pull-request-number }})"
