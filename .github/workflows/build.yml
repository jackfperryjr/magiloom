name: PR Build

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    # A DENYLIST, deliberately — and deliberately identical to the one in
    # release.yml. An allowlist was tried first and rotted: it listed `**.ts`,
    # which does NOT match `.tsx`, so most of the renderer never triggered a
    # packaging run; CSS-only and asset-only PRs skipped it too. The effect was
    # that a PR could merge un-packaged and then fail in release.yml, on main,
    # AFTER the tag job had already pushed a version tag — leaving a tag with no
    # artifacts. Matching release.yml's filter means the rule is now simply: if
    # merging it would cut a release, packaging it is proven on the PR first.
    # Anything new (a .vue, a .wasm, some future config) is covered by default.
    paths-ignore:
      - '**.md'
      - 'docs/loomy/**'

permissions:
  contents: write

# Three OSes per run, so don't let a stack of pushes to one PR pile up — only the
# newest commit's packaging result is meaningful. Runs on main are untouched by
# this; it is keyed to the PR ref.
concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch_flag: ""
            artifact_name: dist-windows
            artifact_pattern: "dist/*.exe"
          - os: macos-latest
            arch_flag: "--x64 --arm64"
            artifact_name: dist-macos
            artifact_pattern: "dist/*.dmg"
          - os: ubuntu-latest
            arch_flag: ""
            artifact_name: dist-linux
            artifact_pattern: "dist/*.AppImage"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Build and package
        run: npx electron-vite build && npx electron-builder ${{ matrix.arch_flag }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
