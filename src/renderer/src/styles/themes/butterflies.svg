<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <!-- One butterfly, wings open, centred on its body. The right pair is drawn and
         mirrored. Veins are cut in a darker stroke so the wings read as wings and
         not as four blobs once the whole thing is faded right down. -->
    <g id="wings">
      <path d="M2 -6 C5 -30 28 -54 54 -48 C63 -46 62 -27 51 -14 C39 -1 18 1 3 0 Z"/>
      <path d="M3 3 C20 2 41 6 43 22 C44 37 29 44 19 35 C11 28 5 17 3 7 Z"/>
    </g>
    <g id="veins" stroke="#3a1226" stroke-opacity=".5" stroke-width="1" stroke-linecap="round">
      <path d="M4 -4 C14 -22 32 -40 52 -44"/>
      <path d="M4 -3 C20 -16 40 -28 57 -32"/>
      <path d="M4 -2 C20 -6 36 -10 50 -15"/>
      <path d="M4 5 C18 7 32 12 41 22"/>
      <path d="M4 7 C12 15 20 26 24 37"/>
    </g>
    <g id="b">
      <use href="#wings"/><use href="#veins"/>
      <use href="#wings" transform="scale(-1 1)"/><use href="#veins" transform="scale(-1 1)"/>
      <ellipse rx="2.4" ry="14" fill="#3a1226"/>
      <path d="M-1 -13 C-4 -24 -10 -29 -15 -30 M1 -13 C4 -24 10 -29 15 -30" stroke="#3a1226" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </defs>
  <!-- A loose drift rising from the lower right: largest and nearest at the bottom,
       smaller and fainter as they climb, the way a flight of them thins out. -->
  <g fill="#ff8fc0">
    <use href="#b" transform="translate(655 465) rotate(-16) scale(2.15)"/>
    <use href="#b" transform="translate(425 525) rotate(24) scale(1.3)" fill="#f7a8d8" opacity=".85"/>
    <use href="#b" transform="translate(735 250) rotate(14) scale(1.15)" fill="#e79ae0" opacity=".8"/>
    <use href="#b" transform="translate(545 305) rotate(-30) scale(.85)" opacity=".7"/>
    <use href="#b" transform="translate(670 120) rotate(-8) scale(.65)" fill="#f7a8d8" opacity=".6"/>
    <use href="#b" transform="translate(585 55) rotate(28) scale(.45)" fill="#e79ae0" opacity=".5"/>
    <use href="#b" transform="translate(300 450) rotate(-38) scale(.55)" opacity=".5"/>
  </g>
</svg>
